<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>かざすだけ丸つけ・試作0.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{height:64px;padding:18px 22px;font-size:22px;font-weight:700;background:#171717}
main{padding:12px 14px 24px}.stage{position:relative;width:100%;aspect-ratio:3/4;background:#000;border:3px solid #aaa;border-radius:4px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;inset:5%;border:2px solid rgba(255,255,255,.75);pointer-events:none}
.guide:before{content:"答え欄をここに合わせる";position:absolute;top:8px;left:10px;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;font-size:15px}
.marks{position:absolute;inset:0;pointer-events:none}
.mark{position:absolute;font-size:42px;font-weight:800;text-shadow:0 2px 5px #000}
.ok{color:#fff}.ng{color:#fff}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{border:0;border-radius:12px;padding:16px 8px;font-size:17px;font-weight:700;background:#fff;color:#111}
button:disabled{background:#777;color:#222}
.status{margin-top:12px;padding:12px;border-radius:10px;background:#1d1d1d;line-height:1.6;font-size:14px}
.small{opacity:.75;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<header>かざすだけ丸つけ・試作0.3</header>
<main>
<div class="stage">
  <video id="video" autoplay playsinline muted></video>
  <div class="guide"></div>
  <div id="marks" class="marks"></div>
</div>
<div class="controls">
  <button id="start">カメラ開始</button>
  <button id="test" disabled>答え欄テスト</button>
  <button id="clear">○×を消す</button>
</div>
<div id="status" class="status">3桁＋3桁用。今回は「答え欄だけを読む」方式の位置検証版です。</div>
<div class="small">写真は保存しません。認識処理はこの試作では実装途中です。</div>
</main>
<script>
const video=document.getElementById('video');
const start=document.getElementById('start');
const test=document.getElementById('test');
const clear=document.getElementById('clear');
const marks=document.getElementById('marks');
const status=document.getElementById('status');

async function camera(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    video.srcObject=s; test.disabled=false;
    status.textContent="カメラ起動OK。プリント全体を枠に合わせて「答え欄テスト」を押してください。";
  }catch(e){status.textContent="カメラを起動できませんでした。Safariのカメラ許可を確認してください。";}
}
start.onclick=camera;
clear.onclick=()=>marks.innerHTML="";

/* B80b等の8問レイアウトを想定した「答え欄位置」だけのデモ。
   実認識ではこの8領域を個別にOCR/数字認識へ渡す。 */
test.onclick=()=>{
  marks.innerHTML="";
  const pos=[
    [25,27],[75,27],[25,50],[75,50],
    [25,72],[75,72],[25,94],[75,94]
  ];
  pos.forEach(([x,y],i)=>{
    const d=document.createElement("div");
    d.className="mark ok"; d.textContent="○";
    d.style.left=`${x}%`; d.style.top=`${y}%`;
    d.style.transform="translate(-50%,-50%)";
    marks.appendChild(d);
  });
  status.textContent="8つの「答え欄」だけに判定位置を重ねるデモです。次段階で各領域の手書き数字認識を接続します。";
};
</script>
</body>
</html>

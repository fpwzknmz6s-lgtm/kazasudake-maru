<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>かざすだけ丸つけ v07</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:14px}
h1{font-size:22px;margin:4px 0 6px}.note{color:#bbb;font-size:14px;line-height:1.5;margin-bottom:12px}
.camera{position:relative;width:100%;aspect-ratio:4/3;background:#222;border-radius:18px;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.sheetGuide{position:absolute;left:4%;right:4%;top:4%;bottom:4%;border:3px solid #fff;border-radius:10px;pointer-events:none}
.sheetGuide:after{content:"1枚全部を入れる";position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:15px;font-weight:700;text-shadow:0 2px 5px #000;white-space:nowrap}
.overlay{position:absolute;inset:0;pointer-events:none}
.mark{position:absolute;width:46px;height:46px;border:5px solid #00ff22;border-radius:50%;display:none;box-shadow:0 0 5px #000}
.cross{position:absolute;width:46px;height:46px;display:none}
.cross:before,.cross:after{content:"";position:absolute;left:20px;top:0;width:5px;height:46px;background:#ff3030;border-radius:4px}
.cross:before{transform:rotate(45deg)}.cross:after{transform:rotate(-45deg)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
button{border:0;border-radius:18px;padding:22px 8px;font-size:19px;font-weight:700;background:#fff;color:#111}
button:disabled{opacity:.45}
.panel{margin-top:16px;background:#1d1d1d;border-radius:18px;padding:16px}
.status{font-size:18px;line-height:1.5}
.results{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.item{background:#090909;border-radius:10px;padding:10px;font-size:16px}
.ok{color:#0f2}.ng{color:#f55}.maybe{color:#ddd}
.small{color:#aaa;font-size:13px;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>かざすだけ丸つけ v07</h1>
<div class="note">目標：1枚を15cm前後から一気に認識。まずは8問を同時に読むテストです。</div>

<div class="camera" id="camera">
<video id="video" autoplay playsinline muted></video>
<div class="sheetGuide"></div>
<div class="overlay" id="overlay"></div>
</div>

<div class="controls">
<button id="start">カメラ開始</button>
<button id="test">1枚まるごと認識</button>
<button id="demo">○×表示テスト</button>
<button id="clear">○×を消す</button>
</div>

<div class="panel">
<div id="status" class="status">カメラ開始を押してください。</div>
<div id="results" class="results"></div>
<div class="small">この版は開発テストです。写真ファイルとして保存はしません。認識結果を確認してから、瞬時の○×表示へ進めます。</div>
</div>
</div>

<script>
const video=document.getElementById('video');
const start=document.getElementById('start');
const test=document.getElementById('test');
const demo=document.getElementById('demo');
const clear=document.getElementById('clear');
const status=document.getElementById('status');
const results=document.getElementById('results');
const overlay=document.getElementById('overlay');
let stream=null;

start.onclick=async()=>{
 try{
  status.textContent='カメラ起動中…';
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:'environment'},aspectRatio:{ideal:4/3},width:{ideal:1280},height:{ideal:960}},
   audio:false
  });
  video.srcObject=stream;
  await video.play();
  const s=stream.getVideoTracks()[0].getSettings();
  status.textContent='カメラOK。15cm前後から、答案1枚が白枠に全部入る位置へ。';
 }catch(e){status.textContent='カメラ起動エラー：'+e.message}
};

function clearMarks(){overlay.innerHTML='';}
demo.onclick=()=>{
 clearMarks();
 const positions=[
  [.25,.24],[.75,.24],[.25,.43],[.75,.43],
  [.25,.62],[.75,.62],[.25,.81],[.75,.81]
 ];
 positions.forEach((p,i)=>{
  const m=document.createElement('div');m.className='mark';m.style.display='block';
  m.style.left=(p[0]*100-3)+'%';m.style.top=(p[1]*100-3)+'%';overlay.appendChild(m);
 });
 status.textContent='○×表示テスト：8問分の○を表示しました。';
};
clear.onclick=()=>{clearMarks();status.textContent='○×を消しました。';results.innerHTML='';};

function cropAnswer(c,i){
 const W=video.videoWidth,H=video.videoHeight;
 // B72b系の2列×4行。各答え欄を広めに切り出す。
 const cols=[.15,.61], rows=[.20,.40,.60,.80];
 const col=i%2,row=Math.floor(i/2);
 const x=W*cols[col], y=H*(rows[row]-.065);
 const w=W*.28,h=H*.13;
 const c=document.createElement('canvas');c.width=900;c.height=420;
 const ctx=c.getContext('2d');
 ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);
 ctx.filter='grayscale(1) contrast(1.8)';
 ctx.drawImage(video,x,y,w,h,0,0,c.width,c.height);
 return c;
}

async function recognizeOne(c){
 const r=await Tesseract.recognize(c,'eng',{
  logger:m=>{ if(m.status==='recognizing text') status.textContent='数字を認識中… '+Math.round((m.progress||0)*100)+'%'; },
  tessedit_pageseg_mode:10,
  tessedit_char_whitelist:'0123456789'
 });
 return {text:(r.data.text||'').replace(/[^0-9]/g,''),confidence:r.data.confidence??0};
}

test.onclick=async()=>{
 test.disabled=true;demo.disabled=true;clearMarks();results.innerHTML='';
 try{
  if(!video.videoWidth) throw new Error('カメラを先に開始してください。');
  if(typeof Tesseract==='undefined') throw new Error('OCRライブラリを読み込めません。');
  status.textContent='1枚分を一時処理しています…';
  const crops=Array.from({length:8},(_,i)=>cropAnswer(null,i));
  const ans=[];
  for(let i=0;i<8;i++){
    status.textContent='8問を一気に認識中… '+(i+1)+'/8';
    try{ans.push(await recognizeOne(crops[i]));}
    catch(e){ans.push({text:'',confidence:0,error:e.message});}
  }
  results.innerHTML=ans.map((a,i)=>{
    const cls=a.text&&a.confidence>=45?'ok':'maybe';
    return `<div class="item ${cls}">${i+1}問目　認識：${a.text||'読めず'}<br>信頼度：${Math.round(a.confidence)}</div>`;
  }).join('');
  status.textContent='1枚まるごと認識テスト完了。8問の結果を確認してください。';
 }catch(e){
  status.textContent='エラー：'+(e.message||e);
 }finally{test.disabled=false;demo.disabled=false;}
};
</script>
</body>
</html>

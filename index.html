<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>かざすだけ丸つけ v0.5</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}
.camera{position:relative;width:100%;aspect-ratio:4/3;background:#222;border-radius:18px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;left:8%;right:8%;top:8%;bottom:8%;border:3px solid #fff;border-radius:12px;pointer-events:none}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
button{border:0;border-radius:18px;padding:25px 10px;font-size:21px;font-weight:700;background:#fff;color:#111}
button:disabled{opacity:.45}
.panel{margin-top:18px;background:#1d1d1d;border-radius:18px;padding:18px}
.status{font-size:18px;line-height:1.5}
pre{white-space:pre-wrap;word-break:break-word;background:#090909;border-radius:12px;padding:14px;font-size:16px;line-height:1.45;min-height:80px}
.small{color:#bbb;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<h1>かざすだけ丸つけ v0.5（認識デバッグ版）</h1>

<div class="camera">
  <video id="video" autoplay playsinline muted></video>
  <div class="guide"></div>
</div>

<div class="controls">
  <button id="start">カメラ開始</button>
  <button id="test">手書き認識テスト</button>
  <button id="demo">答え欄テスト</button>
  <button id="clear">○×を消す</button>
</div>

<div class="panel">
  <div id="status" class="status">まず「カメラ開始」を押してください。</div>
  <pre id="raw">ここにOCRの生の認識結果が表示されます。</pre>
</div>

<div class="panel">
  <div class="small">
    ※この版は「OCRが何と読んだか」を確認するためのテスト版です。<br>
    写真は保存しません。カメラ映像から一時的に処理します。
  </div>
</div>
</div>

<script>
const video=document.getElementById('video');
const start=document.getElementById('start');
const test=document.getElementById('test');
const demo=document.getElementById('demo');
const clear=document.getElementById('clear');
const status=document.getElementById('status');
const raw=document.getElementById('raw');

let stream=null;

start.onclick=async()=>{
  try{
    status.textContent='カメラ起動中…';
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    status.textContent='カメラOK。答案を枠に合わせて「手書き認識テスト」を押してください。';
  }catch(e){
    status.textContent='カメラ起動エラー: '+e.message;
  }
};

demo.onclick=()=>{
  status.textContent='答え欄テスト：○を表示しました。';
};

clear.onclick=()=>{
  status.textContent='○×を消しました。';
  raw.textContent='';
};

function cropCanvas(x,y,w,h){
  const c=document.createElement('canvas');
  c.width=900;c.height=700;
  const ctx=c.getContext('2d');
  ctx.drawImage(video,x,y,w,h,0,0,c.width,c.height);
  return c;
}

test.onclick=async()=>{
  // まず「クリック自体が認識された」ことを即表示
  status.textContent='手書き認識テスト開始。カメラ画像を一時処理しています…';
  raw.textContent='OCR準備中…';
  test.disabled=true;

  try{
    if(!video.videoWidth){
      throw new Error('カメラ映像が取得できていません。「カメラ開始」を先に押してください。');
    }
    if(typeof Tesseract==='undefined'){
      throw new Error('OCRライブラリを読み込めていません。通信状態を確認してください。');
    }

    const W=video.videoWidth,H=video.videoHeight;
    // 画面中央のガイド内を1枚としてOCRに渡す診断版
    const x=Math.round(W*.08), y=Math.round(H*.08);
    const w=Math.round(W*.84), h=Math.round(H*.84);
    const canvas=cropCanvas(x,y,w,h);

    status.textContent='OCR実行中…（少し時間がかかります）';
    const result=await Tesseract.recognize(canvas,'eng',{
      logger:m=>{
        if(m.status){
          const p=m.progress?Math.round(m.progress*100):0;
          status.textContent='OCR: '+m.status+(p?' '+p+'%':'');
        }
      }
    });

    const text=(result.data.text||'').trim();
    raw.textContent=
      '【OCRが実際に読んだ文字】\n'+(text||'（文字を認識できませんでした）')+
      '\n\n【信頼度】 '+(result.data.confidence??'不明')+
      '\n\n【診断】\n'+
      (text ? 'OCR処理は成功。次は数字の切り出し・採点処理を改善します。'
            : 'OCR処理は動作したが、文字を認識できませんでした。');

    status.textContent='認識テスト完了。下の「OCRが実際に読んだ文字」を確認してください。';
  }catch(e){
    status.textContent='認識テストでエラーが発生しました。';
    raw.textContent='【エラー内容】\n'+(e?.stack||e?.message||String(e));
  }finally{
    test.disabled=false;
  }
};
</script>
</body>
</html>
